<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>오늘의 날씨 정보판</title>
</head>
<body>

<main class="weather-card">

    <h1 class="title">오늘의 날씨</h1>
    <p class="subtitle">부산의 현재 날씨 정보</p>

    <div id="weatherInfo">
        날씨 정보를 불러오는 중...
    </div>

</main>

<script src="adapter.js"></script>

<script>
    async function getWeather() {
        const testMode =
            new URLSearchParams(location.search).get("mode");

        let url;

        if (testMode === "timeout") {
            url = "fixtures/timeout.json";
        } else if (testMode === "auth") {
            url = "fixtures/auth-401.json";
        } else if (testMode === "rate") {
            url = "fixtures/rate-429.json";
        } else if (testMode === "offline") {
            url = "fixtures/offline.json";
        } else if (testMode === "schema") {
            url = "fixtures/schema-break.json";
        } else if (testMode === "recover") {
            url = "fixtures/recover-d2.json";
        } else {
            url =
                "https://api.open-meteo.com/v1/forecast" +
                "?latitude=35.1796" +
                "&longitude=129.0756" +
                "&current=temperature_2m" +
                "&timezone=Asia%2FSeoul";
        }

        try {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("HTTP_ERROR");
            }

            let data = await response.json();
            if (testMode === "recover") {
                data = data.payload;
            }

            if (testMode === "recover") {
                document.getElementById("weatherInfo").innerHTML = `
                    <div class="temperature-box">
                        <div class="date">
                            ${data.record_date}
                        </div>

                        <p class="temperature">
                            ${data.normalized_value} ${data.unit}
                        </p>
                    </div>

                    <div class="comparison">
                        <p class="comparison-title">
                            현재 상태
                        </p>

                        <p class="comparison-value">
                            정상 복구 · fresh
                        </p>
                    </div>

                    <div class="source">
                        출처: ${data.source_name}
                    </div>
                `;

                console.log("복구 성공:", data);

                return;
            }
            // timeout fixture 테스트
            // 오류 fixture 테스트
            if (
                testMode === "timeout" ||
                testMode === "auth" ||
                testMode === "rate" ||
                testMode === "offline" ||
                testMode === "schema"
            ) {
                const status = runFixture(data);

                if (status.error_code !== "none") {
                    const error = new Error(status.error_code);
                    error.code = status.error_code;
                    throw error;
                }
            }

            if (testMode === "recover") {
                data = data.payload;
            }

            const fetchedAt = new Date().toISOString();

            const reading = normalizeWeather(data, fetchedAt);

            const temperature = reading.normalized_value;
            const date = reading.record_date;

            // 하루 기록
            const todayRecord = {
                date: reading.record_date,
                value: reading.normalized_value,
                unit: reading.unit,
                source: reading.source_name,
                sourceUrl: reading.source_url,
                sourceTime: reading.source_time,
                queriedAt: reading.fetched_at,
                timezone: reading.record_timezone,
                status: "fresh"
            };

            // 기존 기록 가져오기
            const saved = localStorage.getItem("weatherRecords");
            const records = saved ? JSON.parse(saved) : [];

            // 같은 날짜면 기존 기록을 갱신
            const existingIndex = records.findIndex(
                record => record.date === todayRecord.date
            );

            if (existingIndex !== -1) {
                records[existingIndex] = todayRecord;
            } else {
                records.push(todayRecord);
            }

            // 저장
            localStorage.setItem(
                "weatherRecords",
                JSON.stringify(records)
            );

            // 어제 날짜 계산
            const todayDate = new Date(date);
            todayDate.setDate(todayDate.getDate() - 1);

            const yesterday =
                todayDate.toISOString().slice(0, 10);

            // 어제 기록 찾기
            const yesterdayRecord = records.find(
                record => record.date === yesterday
            );

            // 어제와 비교
            let comparisonText;

            if (yesterdayRecord) {
                const difference =
                    temperature - yesterdayRecord.value;

                comparisonText =
                    `어제(${yesterday})보다 ${
                        difference >= 0 ? "+" : ""
                    }${difference.toFixed(1)}°C`;
            } else {
                comparisonText = "비교 데이터 없음";
            }

            // 정상 화면
            document.getElementById("weatherInfo").innerHTML = `
                <div class="temperature-box">
                    <div class="date">${date}</div>
                    <p class="temperature">
                        ${temperature}°C
                    </p>
                </div>

                <div class="comparison">
                    <p class="comparison-title">
                        어제와 비교
                    </p>

                    <p class="comparison-value">
                        ${comparisonText}
                    </p>
                </div>

                <div class="source">
                    출처: ${reading.source_name}
                </div>

                <div class="data-meta">
                    <div>측정 시각: ${reading.source_time}</div>
                    <div>조회 시각: ${reading.fetched_at}</div>
                    <div>시간대: ${reading.record_timezone}</div>
                </div>
            `;

            // 콘솔 확인
            console.log("오늘의 기록:", todayRecord);
            console.log("전체 저장 기록:", records);

        } catch (error) {
            console.error("날씨 조회 실패:", error);

            const saved =
                localStorage.getItem("weatherRecords");

            const records =
                saved ? JSON.parse(saved) : [];

            const errorMessages = {
                timeout: "응답 시간 초과",
                auth: "인증 오류 (401/403)",
                rate_limit: "요청 제한 초과 (429)",
                offline: "네트워크 연결 없음",
                schema_error: "응답 형식 오류"
            };

            const errorCode = error.code || "schema_error";
            const errorMessage =
                errorMessages[errorCode] || "알 수 없는 오류";

            // 마지막 정상값 유지
            if (records.length > 0) {
                const lastRecord =
                    records[records.length - 1];

                document.getElementById(
                    "weatherInfo"
                ).innerHTML = `
                    <div class="temperature-box">
                        <div class="date">
                            ${lastRecord.date}
                        </div>

                        <p class="temperature">
                            ${lastRecord.value}°C
                        </p>
                    </div>

                    <div class="comparison">
                        <p class="comparison-title">
                            현재 상태
                        </p>

                        <p class="comparison-value">
                            ⚠️ 마지막 정상값 유지 · ${errorMessage}
                        </p>
                    </div>

                    <div class="source">
                        출처: ${lastRecord.source}
                    </div>

                    <button
                        onclick="location.href='?mode=recover'">
                        다시 시도
                    </button>
                `;
            }
        }
    }

    getWeather();
</script>

</body>
</html>
